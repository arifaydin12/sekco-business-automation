<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEKCO - Business Automation System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">S</div>
                <div>
                    <div class="logo-text">SEKCO</div>
                    <div class="logo-subtitle">Business Automation System</div>
                </div>
            </div>
            
            <nav class="header-nav">
                <button class="nav-btn active" onclick="showSection('dashboard')">Dashboard</button>
                <button class="nav-btn" onclick="showSection('users')">Users</button>
            </nav>
            
            <div class="user-info">
                <div class="user-details">
                    <div id="userNameDisplay" class="user-name">Loading...</div>
                    <div id="userRoleDisplay" class="user-role">...</div>
                </div>
                <div id="userAvatar" class="user-avatar">..</div>
                <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
            </div>
        </header>

        <div id="dashboard" class="main-content active"></div>
        <div id="users" class="main-content">
             <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">User Management</h3>
                    <button class="btn btn-primary" onclick="openUserModal()">
                        <i class="fas fa-user-plus"></i> New User
                    </button>
                </div>
                <div class="table-container">
                    <table id="userTable">
                        <thead>
                            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr id="user-table-loader">
                                <td colspan="5" style="text-align: center; padding: 40px;"><div class="loader"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <div id="userModal" class="modal"></div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
